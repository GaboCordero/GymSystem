<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragmentos/menu :: head('Membresías')}"></head>
    <body class="bg-light">

        <nav th:replace="~{fragmentos/menu :: menuAdmin}"></nav>

        <main class="container py-5">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">Membresías de clientes</h2>

                <a th:href="@{/membresia/nuevo}" class="btn btn-primary">
                    Asignar membresía
                </a>
            </div>

            <div th:replace="~{fragmentos/menu :: mensajes}"></div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Cliente</th>
                                    <th>Plan</th>
                                    <th>Inicio</th>
                                    <th>Fin</th>
                                    <th>Precio</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="membresia : ${membresias}">
                                    <td th:text="${membresia.cliente.usuario.nombre + ' ' + membresia.cliente.usuario.apellidos}"></td>
                                    <td th:text="${membresia.plan.nombre}"></td>
                                    <td th:text="${#temporals.format(membresia.fechaInicio, 'dd/MM/yyyy')}"></td>
                                    <td th:text="${#temporals.format(membresia.fechaFin, 'dd/MM/yyyy')}"></td>
                                    <td th:text="${'₡' + #numbers.formatDecimal(membresia.precio, 1, 'COMMA', 2, 'POINT')}"></td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${membresia.estado == 'ACTIVA'} ? 'bg-success' : (${membresia.estado == 'PENDIENTE'} ? 'bg-warning text-dark' : 'bg-secondary')"
                                              th:text="${membresia.estado}">
                                        </span>
                                    </td>
                                    <td>
                                        <a th:href="@{/membresia/detalle/{id}(id=${membresia.idMembresia})}"
                                           class="btn btn-outline-primary btn-sm">
                                            Ver pagos
                                        </a>
                                    </td>
                                </tr>

                                <tr th:if="${#lists.isEmpty(membresias)}">
                                    <td colspan="7" class="text-center text-muted">
                                        No hay membresías registradas.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </body>
</html>
