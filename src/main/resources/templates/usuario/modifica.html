<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registrar usuario - GymSystem</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">

        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" th:href="@{/usuario/listado}">GymSystem</a>
            </div>
        </nav>

        <main class="container py-5">
            <div class="card shadow-sm mx-auto" style="max-width: 750px;">
                <div class="card-body p-4">

                    <h3 class="mb-4"
                        th:text="${edicion} ? 'Modificar usuario' : 'Registrar usuario'">
                    </h3>

                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>


                    <form th:action="${edicion} ? @{|/usuario/actualizar/${usuario.idUsuario}|} : @{/usuario/guardar}"
                          th:object="${usuario}" method="post">


                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control"
                                       th:field="*{nombre}" maxlength="50" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Apellidos</label>
                                <input type="text" class="form-control"
                                       th:field="*{apellidos}" maxlength="75" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombre de usuario</label>
                                <input type="text" class="form-control"
                                       th:field="*{username}" maxlength="50" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control"
                                       th:field="*{correo}" maxlength="100" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Teléfono</label>
                                <input type="text" class="form-control"
                                       th:field="*{telefono}" maxlength="25">
                            </div>

                            <div class="col-md-6 mb-3" th:unless="${edicion}">
                                <label class="form-label">Contraseña</label>
                                <input type="password" class="form-control"
                                       th:field="*{password}" required>
                            </div>

                        </div>

                        <div class="mb-3" th:if="${superadmin == true and edicion != true}">
                            <label class="form-label">Gimnasio</label>
                            <select class="form-select" name="idEmpresa" required>
                                <option value="">Seleccione un gimnasio</option>
                                <option th:each="empresa : ${empresas}"
                                        th:if="${empresa.activo}"
                                        th:value="${empresa.idEmpresa}"
                                        th:text="${empresa.nombre}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-4" th:unless="${edicion}">
                            <label class="form-label">Rol</label>
                            <select class="form-select" name="rol" required>
                                <option value="">Seleccione un rol</option>

                                <option th:if="${superadmin}" value="ADMIN">
                                    Administrador
                                </option>

                                <th:block th:unless="${superadmin}">
                                    <option value="ENTRENADOR">Entrenador</option>
                                    <option value="CLIENTE">Cliente</option>
                                </th:block>
                            </select>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/usuario/listado}"
                               class="btn btn-secondary">Cancelar</a>


                            <button type="submit" class="btn btn-primary"
                                    th:text="${edicion} ? 'Guardar cambios' : 'Registrar usuario'">
                            </button>

                        </div>

                    </form>

                </div>
            </div>
        </main>

    </body>
</html>
