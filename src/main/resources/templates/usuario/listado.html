<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Usuarios - GymSystem</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">

        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="#">GymSystem</a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        Cerrar sesión
                    </button>
                </form>
            </div>
        </nav>

        <main class="container py-5">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Gestión de usuarios</h2>

                <a th:href="@{/usuario/nuevo}" class="btn btn-primary">
                    Registrar usuario
                </a>
            </div>

            <div th:if="${mensaje}" class="alert alert-success"
                 th:text="${mensaje}"></div>

            <div th:if="${error}" class="alert alert-danger"
                 th:text="${error}"></div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Usuario</th>
                                    <th>Correo</th>
                                    <th>Gimnasio</th>
                                    <th>Roles</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="usuario : ${usuarios}">
                                    <td th:text="${usuario.nombre + ' ' + usuario.apellidos}"></td>
                                    <td th:text="${usuario.username}"></td>
                                    <td th:text="${usuario.correo}"></td>
                                    <td th:text="${usuario.empresa != null ? usuario.empresa.nombre : 'Plataforma'}"></td>
                                    <td>
                                        <span th:each="rol : ${usuario.roles}"
                                              class="badge bg-primary me-1"
                                              th:text="${rol.rol}">
                                        </span>
                                    </td>
                                    <td>
                                        <span th:if="${usuario.activo}" class="badge bg-success">Activo</span>
                                        <span th:unless="${usuario.activo}" class="badge bg-secondary">Inactivo</span>
                                    </td>

                                    <td>
                                        <div th:if="${usuario.empresa != null
                                             and usuario.idUsuario != idUsuarioActual
                                             and ((superadmin and usuario.roles.?[rol == 'ADMIN'].size() > 0)
                                             or (!superadmin
                                             and usuario.roles.?[rol == 'ADMIN' or rol == 'SUPERADMIN'].isEmpty()))}">

                                            <a th:href="@{/usuario/modificar/{id}(id=${usuario.idUsuario})}"
                                               class="btn btn-outline-primary btn-sm">
                                                Editar
                                            </a>

                                            <form th:action="@{/usuario/estado/{id}(id=${usuario.idUsuario})}"
                                                  method="post" class="d-inline">

                                                <button type="submit"
                                                        class="btn btn-sm"
                                                        th:classappend="${usuario.activo} ? 'btn-outline-danger' : 'btn-outline-success'"
                                                        th:text="${usuario.activo} ? 'Desactivar' : 'Activar'">
                                                </button>
                                            </form>
                                        </div>
                                    </td>

                                </tr>

                                <tr th:if="${#lists.isEmpty(usuarios)}">
                                    <td colspan="7" class="text-center text-muted">
                                        No hay usuarios registrados.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>

    </body>
</html>
