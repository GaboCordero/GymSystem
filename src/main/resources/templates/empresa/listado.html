<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Empresas - GymSystem</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">

        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" th:href="@{/empresa/listado}">GymSystem</a>

                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        Cerrar sesión
                    </button>
                </form>
            </div>
        </nav>

        <main class="container py-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Gestión de empresas</h2>
                <a th:href="@{/empresa/nuevo}" class="btn btn-primary">
                    Registrar empresa
                </a>
            </div>

            <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Teléfono</th>
                                <th>Correo</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="empresa : ${empresas}">
                                <td th:text="${empresa.nombre}"></td>
                                <td th:text="${empresa.telefono}"></td>
                                <td th:text="${empresa.correo}"></td>
                                <td>
                                    <span th:if="${empresa.activo}" class="badge bg-success">Activo</span>
                                    <span th:unless="${empresa.activo}" class="badge bg-secondary">Inactivo</span>
                                </td>

                                <td>
                                    <a th:href="@{/empresa/modificar/{id}(id=${empresa.idEmpresa})}"
                                       class="btn btn-outline-primary btn-sm">
                                        Editar
                                    </a>

                                    <form th:action="@{/empresa/estado/{id}(id=${empresa.idEmpresa})}"
                                          method="post" class="d-inline">

                                        <button type="submit"
                                                class="btn btn-sm"
                                                th:classappend="${empresa.activo} ? 'btn-outline-danger' : 'btn-outline-success'"
                                                th:text="${empresa.activo} ? 'Desactivar' : 'Activar'">
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

    </body>
</html>
