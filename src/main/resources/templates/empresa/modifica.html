<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro de empresa - GymSystem</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">

        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" th:href="@{/empresa/listado}">GymSystem</a>
            </div>
        </nav>

        <main class="container py-5">
            <div class="card shadow-sm mx-auto" style="max-width: 700px;">
                <div class="card-body p-4">
                    <h3 class="mb-4"
                        th:text="${empresa.idEmpresa == null} ? 'Registrar empresa' : 'Modificar empresa'">
                    </h3>

                    <form th:action="@{/empresa/guardar}" th:object="${empresa}" method="post">

                        <input type="hidden" th:field="*{idEmpresa}">

                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre del gimnasio</label>
                            <input type="text" class="form-control" id="nombre"
                                   th:field="*{nombre}" maxlength="100" required>
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="text" class="form-control" id="telefono"
                                   th:field="*{telefono}" maxlength="25">
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="correo"
                                   th:field="*{correo}" maxlength="100">
                        </div>

                        <div class="mb-3">
                            <label for="direccion" class="form-label">Dirección</label>
                            <textarea class="form-control" id="direccion"
                                      th:field="*{direccion}" rows="3" maxlength="255"></textarea>
                        </div>

                        <div class="form-check mb-4">
                            <input type="checkbox" class="form-check-input"
                                   id="activo" th:field="*{activo}">
                            <label for="activo" class="form-check-label">Empresa activa</label>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/empresa/listado}"
                               class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">
                                Guardar
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </main>

    </body>
</html>
