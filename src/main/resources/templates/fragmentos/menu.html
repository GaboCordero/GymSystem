<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

    <head th:fragment="head(titulo)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${titulo} + ' - GymSystem'">GymSystem</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body>

        <nav th:fragment="menuAdmin" class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" th:href="@{/usuario/listado}">GymSystem</a>

                <div class="navbar-nav me-auto">
                    <a class="nav-link" th:href="@{/usuario/listado}">Usuarios</a>
                    <a class="nav-link" th:href="@{/cliente/listado}">Clientes</a>
                    <a class="nav-link" th:href="@{/plan/listado}">Planes</a>
                    <a class="nav-link" th:href="@{/membresia/listado}">Membresías</a>
                    <a class="nav-link" th:href="@{/pago/listado}">Pagos</a>
                </div>

                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        Cerrar sesión
                    </button>
                </form>
            </div>
        </nav>

        <nav th:fragment="menuEntrenador" class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" th:href="@{/rutina/listado}">GymSystem</a>

                <div class="navbar-nav me-auto">
                    <a class="nav-link" th:href="@{/ejercicio/listado}">Ejercicios</a>
                    <a class="nav-link" th:href="@{/rutina/listado}">Rutinas</a>
                    <a class="nav-link" th:href="@{/asignacion/listado}">Asignaciones</a>
                </div>

                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        Cerrar sesión
                    </button>
                </form>
            </div>
        </nav>

        <nav th:fragment="menuCliente" class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" th:href="@{/mi-rutina}">GymSystem</a>

                <div class="navbar-nav me-auto">
                    <a class="nav-link" th:href="@{/mi-rutina}">Mi rutina</a>
                </div>

                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        Cerrar sesión
                    </button>
                </form>
            </div>
        </nav>

        <div th:fragment="mensajes">
            <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        </div>

    </body>
</html>
