<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gestión de Producto - GymSystem</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">

        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" th:href="@{/producto/listado}">GymSystem</a>
            </div>
        </nav>

        <main class="container py-5">
            <div class="card shadow-sm mx-auto" style="max-width: 700px;">
                <div class="card-body p-4">
                    
                    <h3 class="mb-4" th:text="${producto.id_producto == null} ? 'Registrar producto' : 'Modificar producto'">
                    </h3>

                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/producto/guardar}" th:object="${producto}" method="post">

                        <input type="hidden" th:field="*{id_producto}">

                        <div class="mb-3">
                            <label for="idEmpresa" class="form-label">ID de Empresa</label>
                            <input type="number" class="form-control" id="idEmpresa" 
                                   th:field="*{idEmpresa}" required>
                        </div>

                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre del Producto</label>
                            <input type="text" class="form-control" id="nombre" 
                                   th:field="*{nombre}" maxlength="100" required>
                        </div>

                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion" 
                                      th:field="*{descripcion}" rows="3" maxlength="255"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="precio" class="form-label">Precio ($)</label>
                            <input type="number" step="0.01" class="form-control" id="precio" 
                                   th:field="*{precio}" required>
                        </div>

                        <div class="mb-3">
                            <label for="existencias" class="form-label">Existencias (Inventario)</label>
                            <input type="number" class="form-control" id="existencias" 
                                   th:field="*{existencias}" required>
                        </div>

                        <div class="form-check mb-4">
                            <input type="checkbox" class="form-check-input" id="activo" 
                                   th:field="*{activo}">
                            <label class="form-check-label" for="activo">Producto activo</label>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/producto/listado}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">
                                Guardar
                            </button>
                        </div>

                    </form>

                </div>
            </div>
        </main>

    </body>
</html>
