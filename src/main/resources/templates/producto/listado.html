<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragmentos/menu :: head('Productos')}"></head>
    <body class="bg-light">

        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" th:href="@{/producto/listado}">GymSystem</a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        Cerrar sesión
                    </button>
                </form>
            </div>
        </nav>

        <main class="container py-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">Gestión de Productos e Inventario</h2>

                <div class="d-flex gap-2">
                    <a th:href="@{/producto/modifica}" class="btn btn-primary">
                        Registrar producto
                    </a>

                    <a th:href="@{/usuario/listado}" class="btn btn-outline-primary">
                        Gestión de usuarios
                    </a>

                    <a th:href="@{/empresa/listado}"
                       class="btn btn-outline-primary">
                        Gestión de empresas
                    </a>
                </div>
            </div>

            <div th:if="${mensaje}" class="alert alert-success"
                 th:text="${mensaje}"></div>

            <div th:if="${error}" class="alert alert-danger"
                 th:text="${error}"></div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Descripción</th>
                                    <th>Precio</th>
                                    <th>Existencias</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${productos}">
                                    <td th:text="${p.id_producto}">1</td>
                                    <td th:text="${p.nombre}">Producto</td>
                                    <td th:text="${p.descripcion}">Descripción</td>
                                    <td th:text="${p.precio}">0.00</td>
                                    <td th:text="${p.existencias}">0</td>
                                    <td>
                                        <span th:if="${p.activo}" class="badge bg-success">Activo</span>
                                        <span th:unless="${p.activo}" class="badge bg-secondary">Inactivo</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/producto/modificar/{id}(id=${p.id_producto})}" 
                                           class="btn btn-outline-primary btn-sm">
                                            Editar
                                        </a>
                                        <a th:href="@{/producto/estado/{id}(id=${p.id_producto})}" 
                                           class="btn btn-sm"
                                           th:classappend="${p.activo} ? 'btn-outline-danger' : 'btn-outline-success'"
                                           th:text="${p.activo} ? 'Desactivar' : 'Activar'">
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(productos)}">
                                    <td colspan="7" class="text-center text-muted py-4">No hay productos registrados.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

    </body>
</html>
