<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragmentos/menu :: head('Plan de membresía')}"></head>
    <body class="bg-light">

        <nav th:replace="~{fragmentos/menu :: menuAdmin}"></nav>

        <main class="container py-5">

            <div class="card shadow-sm mx-auto" style="max-width: 700px;">
                <div class="card-body p-4">

                    <h3 class="mb-3"
                        th:text="${plan.idPlan == null} ? 'Registrar plan de membresía' : 'Editar plan de membresía'">
                    </h3>

                    <div th:replace="~{fragmentos/menu :: mensajes}"></div>

                    <form th:action="@{/plan/guardar}" th:object="${plan}" method="post">

                        <input type="hidden" th:field="*{idPlan}">

                        <div class="mb-3">
                            <label class="form-label">Nombre *</label>
                            <input type="text" th:field="*{nombre}" class="form-control"
                                   maxlength="50" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea th:field="*{descripcion}" class="form-control"
                                      rows="3" maxlength="255"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Duración (días) *</label>
                                <input type="number" th:field="*{duracionDias}" class="form-control"
                                       min="1" max="3650" required>
                                <div class="form-text">Ejemplo: 30 para un plan mensual.</div>
                            </div>

                            <div class="col-md-6 mb-4">
                                <label class="form-label">Precio (₡) *</label>
                                <input type="number" th:field="*{precio}" class="form-control"
                                       min="0.01" step="0.01" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/plan/listado}" class="btn btn-secondary">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                Guardar
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </main>
    </body>
</html>
