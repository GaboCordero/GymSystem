<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Clientes - GymSystem</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">

        <nav th:replace="~{fragmentos/menu :: menuAdmin}"></nav>

        <main class="container py-5">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Gestión de clientes</h2>

                <a th:href="@{/cliente/nuevo}" class="btn btn-primary">
                    Registrar cliente
                </a>
            </div>

            <div th:if="${mensaje}" class="alert alert-success"
                 th:text="${mensaje}"></div>

            <div class="card shadow-sm">
                <div class="card-body">

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">

                            <thead>
                                <tr>
                                    <th>Nombre completo</th>
                                    <th>Usuario</th>
                                    <th>Correo</th>
                                    <th>Fecha de registro</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="cliente : ${clientes}">
                                    <td th:text="${cliente.usuario.nombre + ' ' + cliente.usuario.apellidos}"></td>
                                    <td th:text="${cliente.usuario.username}"></td>
                                    <td th:text="${cliente.usuario.correo}"></td>
                                    <td th:text="${cliente.fechaRegistro}"></td>

                                    <td>
                                        <span class="badge"
                                              th:classappend="${cliente.usuario.activo} ? 'bg-success' : 'bg-secondary'"
                                              th:text="${cliente.usuario.activo} ? 'Activo' : 'Inactivo'">
                                        </span>
                                    </td>
                                </tr>

                                <tr th:if="${#lists.isEmpty(clientes)}">
                                    <td colspan="5" class="text-center text-muted">
                                        No hay clientes registrados.
                                    </td>
                                </tr>
                            </tbody>

                        </table>
                    </div>

                    <a th:href="@{/usuario/listado}" class="btn btn-outline-secondary">
                        Volver a usuarios
                    </a>

                </div>
            </div>

        </main>
    </body>
</html>
