<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notificaciones - GymSystem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar superior -->
    <nav class="navbar navbar-dark bg-dark px-4 mb-4">
        <span class="navbar-brand mb-0 h1">GymSystem</span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
        </form>
    </nav>

    <div class="container col-md-8">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Mis Notificaciones y Avisos</h2>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="list-group">
                    <div th:if="${notificaciones.empty}" class="text-center text-muted py-4">
                        No tienes notificaciones pendientes.
                    </div>
                    
                    <div th:each="n : ${notificaciones}" 
                         class="list-group-item list-group-item-action flex-column align-items-start mb-2 rounded border"
                         th:classappend="${!n.leida} ? 'border-primary bg-white' : 'bg-light'">
                        <div class="d-flex w-100 justify-content-between">
                            <h5 class="mb-1 text-primary" th:text="${n.tipo}">TIPO DE AVISO</h5>
                            <small class="text-muted" th:text="${#temporals.format(n.fecha, 'dd/MM/yyyy HH:mm')}">05/11/2026 08:00</small>
                        </div>
                        <p class="mb-1 mt-2" th:text="${n.mensaje}">Mensaje de la notificación...</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
