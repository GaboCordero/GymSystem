<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Ventas - GymSystem</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-4 mb-4">
        <span class="navbar-brand mb-0 h1">GymSystem</span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
        </form>
    </nav>

    <div class="container">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión de Ventas</h2>
            <div>
                <a th:href="@{/venta/nuevo}" class="btn btn-primary">Registrar venta</a>
                <a th:href="@{/producto/listado}" class="btn btn-outline-primary">Gestión de productos</a>
                <a th:href="@{/usuario/listado}" class="btn btn-outline-primary">Gestión de usuarios</a>
                <a th:href="@{/empresa/listado}" class="btn btn-outline-primary">Gestión de empresas</a>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID Venta</th>
                            <th>Empresa ID</th>
                            <th>Usuario ID</th>
                            <th>Cliente ID</th>
                            <th>Fecha</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${ventas.empty}">
                            <td colspan="6" class="text-center text-muted py-4">No hay ventas registradas todavía.</td>
                        </tr>
                        <tr th:each="v : ${ventas}">
                            <td th:text="${v.id_venta}">1</td>
                            <td th:text="${v.id_empresa}">1</td>
                            <td th:text="${v.id_usuario}">1</td>
                            <td th:text="${v.id_cliente != null ? v.id_cliente : 'General'}">General</td>
                            <td th:text="${#temporals.format(v.fecha, 'dd/MM/yyyy HH:mm')}">05/11/2026 12:00</td>
                            <td><strong class="text-success" th:text="${'$' + v.total}">$0.0</strong></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
