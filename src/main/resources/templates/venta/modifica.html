<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Venta - GymSystem</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark px-4 mb-4">
        <span class="navbar-brand mb-0 h1">GymSystem</span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
        </form>
    </nav>

    <div class="container col-md-8">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Registrar Nueva Venta</h2>
            <a th:href="@{/venta/listado}" class="btn btn-outline-secondary btn-sm">Volver al listado</a>
        </div>

        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${param.error}">Error en la transacción</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <form th:action="@{/venta/guardar}" th:object="${venta}" method="post">
                    
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">ID Empresa:</label>
                            <input type="number" th:field="*{id_empresa}" class="form-control" required placeholder="Ej. 1">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">ID Usuario:</label>
                            <input type="number" th:field="*{id_usuario}" class="form-control" required placeholder="Ej. 1">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">ID Cliente (Opcional):</label>
                            <input type="number" th:field="*{id_cliente}" class="form-control" placeholder="Ej. 2">
                        </div>
                    </div>

                    <hr class="my-4">

                    <h5 class="mb-3">Productos a Comprar</h5>
                    <div class="table-responsive mb-4">
                        <table class="table table-bordered align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Seleccionar</th>
                                    <th>Producto</th>
                                    <th>Precio Unitario</th>
                                    <th>Stock Disponible</th>
                                    <th style="width: 150px;">Cantidad</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${productos}">
                                    <td class="text-center">
                                        <input type="hidden" name="idProductos" th:value="${p.id_producto}">
                                        <input type="checkbox" class="form-check-input">
                                    </td>
                                    <td>
                                        <span th:text="${p.nombre}">Nombre Producto</span>
                                    </td>
                                    <td>
                                        <span th:text="${'$' + p.precio}">0.0</span>
                                    </td>
                                    <td>
                                        <span class="badge bg-secondary" th:text="${p.existencias}">0</span>
                                    </td>
                                    <td>
                                        <input type="number" name="cantidades" class="form-control form-control-sm" value="0" min="0" th:max="${p.existencias}">
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/venta/listado}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Finalizar y Guardar Venta</button>
                    </div>

                </form>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
